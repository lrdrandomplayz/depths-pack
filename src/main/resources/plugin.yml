name: DepthsGuard
version: '${version}'
main: net.thedepths.guard.DepthsGuardPlugin
api-version: '1.21'
description: Forces the Depths invisibility-particle pack and can hide invisibility particles server-side.
authors: [kaydnn]

permissions:
  depthsguard.bypass:
    description: Not kicked for declining or failing the server resource pack.
    default: false
